<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OmniTools AI Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-2xl w-full bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-6 space-y-6">
    <!-- Header -->
    <div class="text-center">
      <h1 class="text-3xl font-extrabold text-indigo-400">OmniTools AI</h1>
      <p class="text-slate-400 text-sm mt-1">Fast & Secure AI Content Generator</p>
    </div>

    <!-- Input Section -->
    <div class="space-y-4">
      <div>
        <label for="userPrompt" class="block text-sm font-medium text-slate-300 mb-2">Apna Prompt Likhein:</label>
        <textarea id="userPrompt" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-slate-500" placeholder="E.g., Write a catchy tagline for a tech startup..."></textarea>
      </div>

      <button id="generateBtn" onclick="handleGenerate()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition-all flex items-center justify-center gap-2">
        <span id="btnText">Generate Content</span>
        <div id="loader" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </div>

    <!-- Result Output -->
    <div id="outputContainer" class="hidden space-y-2">
      <label class="block text-sm font-medium text-slate-300">Generated Result:</label>
      <div id="aiOutput" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 text-slate-200 whitespace-pre-wrap text-sm leading-relaxed max-h-96 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    // Universal function that calls the Vercel Serverless Function
    async function generateAIContent(promptText) {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ prompt: promptText })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Server error occurred while calling AI');
      }

      return data.result;
    }

    // Handle button click action
    async function handleGenerate() {
      const promptInput = document.getElementById('userPrompt');
      const promptText = promptInput.value.trim();

      if (!promptText) {
        alert('Kripya pehle kuch prompt likhein!');
        return;
      }

      const generateBtn = document.getElementById('generateBtn');
      const btnText = document.getElementById('btnText');
      const loader = document.getElementById('loader');
      const outputContainer = document.getElementById('outputContainer');
      const aiOutput = document.getElementById('aiOutput');

      // Loading UI State
      generateBtn.disabled = true;
      btnText.innerText = 'Generating...';
      loader.classList.remove('hidden');
      outputContainer.classList.add('hidden');

      try {
        const result = await generateAIContent(promptText);
        aiOutput.innerText = result;
        outputContainer.classList.remove('hidden');
      } catch (error) {
        console.error('Error:', error);
        alert('Error: ' + error.message);
      } finally {
        // Reset UI State
        generateBtn.disabled = false;
        btnText.innerText = 'Generate Content';
        loader.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
