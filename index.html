<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniTools AI - All-in-One Utility Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen p-4">

    <!-- Header -->
    <header class="max-w-2xl mx-auto flex justify-between items-center bg-gray-800 p-4 rounded-xl mb-6 shadow-lg border border-gray-700">
        <h1 class="text-xl font-bold text-blue-400"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>OmniTools AI</h1>
        <button id="login-btn" onclick="loginWithGoogle()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold transition flex items-center gap-2">
            <i class="fa-brands fa-google"></i> Login with Google
        </button>
    </header>

    <main class="max-w-2xl mx-auto space-y-6">

        <!-- EMI Calculator -->
        <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700">
            <h2 class="text-lg font-bold mb-3 text-green-400"><i class="fa-solid fa-calculator mr-2"></i>EMI Calculator</h2>
            <div class="space-y-3">
                <input type="number" id="loanAmount" placeholder="Loan Amount (₹)" value="100000" class="w-full p-2.5 rounded bg-gray-700 border border-gray-600 focus:outline-none text-white">
                <input type="number" id="interestRate" placeholder="Interest Rate (% p.a.)" value="10.5" class="w-full p-2.5 rounded bg-gray-700 border border-gray-600 focus:outline-none text-white">
                <input type="number" id="loanTenure" placeholder="Tenure (Years)" value="2" class="w-full p-2.5 rounded bg-gray-700 border border-gray-600 focus:outline-none text-white">
                <button onclick="calculateEMI()" class="w-full bg-green-600 hover:bg-green-700 p-2.5 rounded font-bold transition">Calculate EMI</button>
                <div id="emiResult" class="text-yellow-400 font-semibold text-center mt-2"></div>
            </div>
        </div>

        <!-- Password Generator -->
        <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700">
            <h2 class="text-lg font-bold mb-3 text-purple-400"><i class="fa-solid fa-key mr-2"></i>Password Generator</h2>
            <button onclick="generatePassword()" class="w-full bg-purple-600 hover:bg-purple-700 p-2.5 rounded font-bold transition">Generate Strong Password</button>
            <div id="passwordResult" class="bg-gray-700 p-3 rounded mt-3 font-mono text-center text-green-300 break-all select-all">Click button to generate</div>
        </div>

    </main>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBYLDwekIWXAIzrXu4PRcRwNwIuIzEKAI",
            authDomain: "omnitools-ai-dec18.firebaseapp.com",
            projectId: "omnitools-ai-dec18",
            storageBucket: "omnitools-ai-dec18.firebasestorage.app",
            messagingSenderId: "735093006560",
            appId: "1:735093006560:web:c619bbr2e7fa789eb2ed5"
        };

        // Safe Firebase Init
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
        } catch(e) {
            console.error("Firebase init failed:", e);
        }

        const auth = firebase.auth();

        // Google Login
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    alert("Welcome " + result.user.displayName + "!");
                })
                .catch((error) => {
                    alert("Login failed: " + error.message);
                });
        }

        // Track Login State
        auth.onAuthStateChanged((user) => {
            const authBtn = document.getElementById('login-btn');
            if (user && authBtn) {
                authBtn.innerText = "Logout (" + user.displayName.split(' ')[0] + ")";
                authBtn.onclick = function() {
                    auth.signOut().then(() => location.reload());
                };
            }
        });

        // EMI Function
        function calculateEMI() {
            const p = parseFloat(document.getElementById('loanAmount').value);
            const r = parseFloat(document.getElementById('interestRate').value) / 12 / 100;
            const n = parseFloat(document.getElementById('loanTenure').value) * 12;

            if (p > 0 && r > 0 && n > 0) {
                const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                document.getElementById('emiResult').innerText = "Monthly EMI: ₹" + emi.toFixed(2);
            } else {
                document.getElementById('emiResult').innerText = "Please fill all fields correctly.";
            }
        }

        // Password Generator Function
        function generatePassword() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
            let pwd = "";
            for (let i = 0; i < 14; i++) {
                pwd += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passwordResult').innerText = pwd;
        }
    </script>
</body>
</html>
