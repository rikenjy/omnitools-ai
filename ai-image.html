<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free AI Prompt-to-Image Generator - OmniTools AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .ad-slot { background: rgba(30, 41, 59, 0.5); border: 1px dashed #334155; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="text-2xl font-black text-indigo-500">OmniTools<span class="text-white">AI</span></span>
      </a>
      <a href="/" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-semibold text-xs transition">All Tools</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full px-4 py-8 flex-grow space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white">AI <span class="text-indigo-400">Image Generator</span></h1>
      <p class="text-slate-400 text-sm max-w-lg mx-auto">Type a prompt to render client-side visuals instantly.</p>
    </div>

    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Image Prompt:</label>
        <input type="text" id="imgPrompt" placeholder="E.g., Futuristic cyberpunk city with neon lights 8k" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button onclick="genImg()" id="imgBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition">Generate Visual</button>

      <div id="imgBox" class="hidden text-center space-y-3 pt-4">
        <div id="imgContainer" class="w-full h-64 bg-slate-900 border border-slate-700 rounded-xl flex items-center justify-center text-slate-500 text-xs p-4"></div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-900/50 py-6 text-center text-xs text-slate-500">
    <p>© 2026 OmniTools AI Suite. All rights reserved.</p>
  </footer>

  <script>
    function genImg() {
      const p = document.getElementById('imgPrompt').value.trim();
      if(!p) return alert('Prompt likhein!');
      
      document.getElementById('imgBtn').innerText = 'Rendering...';
      setTimeout(() => {
        const seed = encodeURIComponent(p);
        document.getElementById('imgContainer').innerHTML = `<img src="https://pollinations.ai/p/${seed}?width=600&height=400" class="w-full h-full object-cover rounded-lg" alt="${p}"/>`;
        document.getElementById('imgBox').classList.remove('hidden');
        document.getElementById('imgBtn').innerText = 'Generate Visual';
      }, 500);
    }
  </script>
</body>
</html>
